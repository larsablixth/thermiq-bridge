# Home Assistant add-on manifest.
#
# Installing this repository in Supervisor puts thermiq-bridge in the add-on
# store; the UI then appears in the sidebar through ingress, with no port to
# publish and no separate host to remember.
#
# The Supervisor writes the options below to /data/options.json, which the
# binary reads directly - so this add-on needs no shell, no bashio and no
# wrapper script.
name: ThermIQ Bridge
version: "0.1.14"
slug: thermiq_bridge
description: >-
  Thermia/Danfoss heat pump over MQTT with its own web UI, JSON API and
  Prometheus metrics. Runs beside Home Assistant rather than inside it.
url: https://github.com/larsablixth/thermiq-bridge
# The Supervisor pulls this image and tags it with `version:` above, so
# ghcr must carry a bare `0.1.6` tag as well as `v0.1.6` - release.yaml
# publishes both.
#
# It does NOT build locally. A local build is not actually possible from
# this repository layout: the Supervisor uses the *add-on directory* as the
# Docker build context, not the repository root, so a Dockerfile here can
# never reach ../src or ../Makefile. That was the original intent and it
# failed with "/src: not found". Two things had to be true before this
# add-on could install at all, and neither was:
#   - `image: null` is not "no image", it is an invalid one, and the whole
#     add-on is dropped from the store with only a supervisor WARNING
#   - the build context is addon/, so building from source cannot work here
image: ghcr.io/larsablixth/thermiq-bridge

# armv7, armhf and i386 were dropped by Home Assistant in 2025.12. The
# published image still carries linux/arm/v7 for plain `docker run` users;
# it is only unsupported as an *add-on* architecture.
arch:
  - aarch64
  - amd64

init: false
startup: services

# The UI is reached through the sidebar; nothing needs to be exposed on the
# host. Add a `ports:` mapping yourself if you also want it on the LAN.
ingress: true
ingress_port: 8080
panel_icon: mdi:heat-pump
panel_title: ThermIQ

options:
  mqtt_host: ""
  mqtt_port: 1883
  mqtt_username: ""
  mqtt_password: ""
  mqtt_client_id: ""
  node: ThermIQ/ThermIQ-mqtt
  id: vp1
  language: en
  hexformat: false
  read_only: false
  debug_writes: false
  publish_prefix: ""
  availability_timeout: 120
  log_level: info
  demo: false
  pool_circuit: false

schema:
  # Optional so the add-on can start in demo mode with nothing configured.
  mqtt_host: str?
  mqtt_port: port
  mqtt_username: str?
  mqtt_password: password?
  # Defaults to thermiq-bridge-<id>. Worth setting only if another bridge on
  # the same broker would otherwise share it - two clients with one id kick
  # each other off in a loop.
  mqtt_client_id: str?
  node: str
  id: match(^[a-z0-9_]+$)
  language: list(en|se|fi|no|de)
  hexformat: bool
  read_only: bool
  debug_writes: bool
  publish_prefix: str?
  availability_timeout: int(10,3600)
  log_level: list(debug|info|warn|error)
  demo: bool
  # The pump drives a second circuit (Curve 2) that heats a pool through a
  # heat exchanger. Turns on the widget's pool branch. Leave off without the
  # expansion card: the pump reports a curve-2 target either way.
  pool_circuit: bool
